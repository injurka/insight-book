<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InsightBook</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet" />

    <link rel="preload" href="/fonts/split/regular/result.css" as="style" />
    <link rel="preload" href="/fonts/split/medium/result.css" as="style" />

    <link rel="stylesheet" href="/fonts/split/light/result.css" />
    <link rel="stylesheet" href="/fonts/split/regular/result.css" />
    <link rel="stylesheet" href="/fonts/split/medium/result.css" />
    <link rel="stylesheet" href="/fonts/split/semibold/result.css" />
    <link rel="stylesheet" href="/fonts/split/bold/result.css" />

    <style>
      body {
        visibility: hidden;
      }
    </style>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        document.body.style.visibility = 'visible'
      })
    </script>
  </head>

  <body>
    <div id="app-preloader" style="
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #0d1117;
        z-index: 99999;
      ">
      <style>
        #app-preloader .spinner {
          width: 40px;
          height: 40px;
          border: 3px solid #21262d;
          border-top-color: #c975de;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }

        @media (prefers-color-scheme: light) {
          #app-preloader {
            background-color: #faf4f2 !important;
          }

          #app-preloader .spinner {
            border-color: #e0dad9;
            border-top-color: #f37a51;
          }
        }

        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
      <div class="spinner"></div>
    </div>

    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>

</html>
