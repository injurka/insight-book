<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>InsightBook</title>

    <!-- Рантайм-конфиг (генерируется при запуске контейнера) -->
    <script src="/configs/app-config.js"></script>

    <!-- Критические шрифты (Latin + Cyrillic): синхронно, 6 @font-face на вес = 18 woff2, ~200 KB -->
    <link rel="stylesheet" href="/fonts/split/regular/result-critical.css" />
    <link rel="stylesheet" href="/fonts/split/medium/result-critical.css" />
    <link rel="stylesheet" href="/fonts/split/semibold/result-critical.css" />

    <!-- CJK-шрифты загружаются лениво через JS — только когда на странице
         реально встречаются иероглифы (см. loadCjkFonts в main.ts) -->

    <script>
      // Загружаем CJK-шрифты динамически, когда на странице появляются иероглифы
      ;(function () {
        var CJK_MIN = 0x4e00
        var loaded = false
        var observer = null

        function hasCJK(text) {
          if (!text) return false
          for (var i = 0; i < text.length; i++) {
            if (text.charCodeAt(i) >= CJK_MIN) return true
          }
          return false
        }

        function loadCjkCss() {
          if (loaded) return
          loaded = true
          if (observer) {
            observer.disconnect()
          }
          ;['regular', 'medium', 'semibold'].forEach(function (w) {
            var link = document.createElement('link')
            link.rel = 'stylesheet'
            link.href = '/fonts/split/' + w + '/result-cjk.css'
            document.head.appendChild(link)
          })
        }

        function checkNode(node) {
          if (node.nodeType === 3) {
            // Text node
            if (hasCJK(node.textContent)) {
              loadCjkCss()
              return true
            }
          } else if (node.nodeType === 1) {
            // Element node
            if (hasCJK(node.textContent)) {
              loadCjkCss()
              return true
            }
          }
          return false
        }

        function checkInitial() {
          if (!document.body) return false
          var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT)
          var node
          while ((node = walker.nextNode())) {
            if (hasCJK(node.textContent)) {
              loadCjkCss()
              return true
            }
          }
          return false
        }

        function init() {
          if (checkInitial()) return

          // Используем MutationObserver для отслеживания динамического контента (Vue/SPA)
          if (typeof MutationObserver !== 'undefined') {
            observer = new MutationObserver(function (mutations) {
              for (var i = 0; i < mutations.length; i++) {
                var mutation = mutations[i]
                if (mutation.addedNodes) {
                  for (var j = 0; j < mutation.addedNodes.length; j++) {
                    if (checkNode(mutation.addedNodes[j])) return
                  }
                }
                if (mutation.type === 'characterData') {
                  if (checkNode(mutation.target)) return
                }
              }
            })
            observer.observe(document.documentElement, {
              childList: true,
              subtree: true,
              characterData: true,
            })
          }

          // Резервный вариант на случай полной загрузки страницы
          window.addEventListener('load', function () {
            checkInitial()
          })
        }

        if (document.body) {
          init()
        } else {
          document.addEventListener('DOMContentLoaded', init)
        }
      })()
    </script>

    <script type="speculationrules">
      {
        "prerender": [
          {
            "source": "document",
            "where": {
              "and": [
                { "href_matches": "/*" },
                { "not": { "href_matches": "/sign-in" } },
                { "not": { "href_matches": "/auth/*" } },
                { "not": { "href_matches": "/api/*" } },
                { "not": { "href_matches": "/reader" } },
                { "not": { "href_matches": "/onboarding" } }
              ]
            },
            "eagerness": "moderate",
            "expects_no_vary_search": "params=()"
          }
        ]
      }
    </script>
  </head>

  <body>
    <div
      id="app-preloader"
      style="
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #0d1117;
        z-index: 99999;
      "
    >
      <style>
        #app-preloader .spinner {
          width: 40px;
          height: 40px;
          border: 3px solid #21262d;
          border-top-color: #c975de;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }

        @media (prefers-color-scheme: light) {
          #app-preloader {
            background-color: #faf4f2 !important;
          }

          #app-preloader .spinner {
            border-color: #e0dad9;
            border-top-color: #f37a51;
          }
        }

        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
      <div class="spinner"></div>
    </div>

    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
