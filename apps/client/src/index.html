<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>InsightBook</title>

    <!-- Рантайм-конфиг (генерируется при запуске контейнера) -->
    <script src="/configs/app-config.js"></script>

    <!-- Шрифты загружаются синхронно (render-blocking), чтобы браузер как можно
         раньше обнаружил @font-face и начал загрузку woff2-файлов.
         font-display: swap гарантирует, что текст покажется системным шрифтом
         немедленно, не дожидаясь окончания загрузки. -->
    <link rel="stylesheet" href="/fonts/split/regular/result.css" />
    <link rel="stylesheet" href="/fonts/split/medium/result.css" />
    <link rel="stylesheet" href="/fonts/split/semibold/result.css" />

    <script type="speculationrules">
      {
        "prerender": [
          {
            "source": "document",
            "where": {
              "href_matches": "/*"
            },
            "eagerness": "moderate"
          }
        ]
      }
    </script>
  </head>

  <body>
    <div
      id="app-preloader"
      style="
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #0d1117;
        z-index: 99999;
      "
    >
      <style>
        #app-preloader .spinner {
          width: 40px;
          height: 40px;
          border: 3px solid #21262d;
          border-top-color: #c975de;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }

        @media (prefers-color-scheme: light) {
          #app-preloader {
            background-color: #faf4f2 !important;
          }

          #app-preloader .spinner {
            border-color: #e0dad9;
            border-top-color: #f37a51;
          }
        }

        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
      <div class="spinner"></div>
    </div>

    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
