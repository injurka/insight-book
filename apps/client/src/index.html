<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.ico" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <script>
      ;(() => {
        const colors = {
          light: '#faf4f2',
          dark: '#0d1117',
          sepia: '#f4ecd8',
          green: '#e8f3e8',
          oled: '#000000',
        }
        let theme = 'system'

        try {
          theme = localStorage.getItem('app-theme') || theme
        } catch {
          // Use the system preference when storage is unavailable.
        }

        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }

        if (!Object.hasOwn(colors, theme)) theme = 'light'

        document.documentElement.setAttribute('data-theme', theme)
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', colors[theme])
        document
          .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          ?.setAttribute('content', theme === 'dark' || theme === 'oled' ? 'black-translucent' : 'default')
      })()
    </script>

    <title>InsightBook</title>

    <style>
      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      #app-preloader {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        width: 100%;
        min-height: 100vh;
        box-sizing: border-box;
        align-items: center;
        justify-content: center;
        background-color: #0d1117;
        z-index: 99999;
      }

      #app-preloader .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #21262d;
        border-top-color: #c975de;
        border-radius: 50%;
        animation: app-preloader-spin 1s linear infinite;
      }

      @media (prefers-color-scheme: light) {
        html[data-theme='light'] #app-preloader {
          background-color: #faf4f2;
        }

        html[data-theme='light'] #app-preloader .spinner {
          border-color: #e0dad9;
          border-top-color: #f37a51;
        }
      }

      #app-preloader .bootstrap-error {
        max-width: 360px;
        padding: 24px;
        color: #f0f6fc;
        font:
          16px/1.5 system-ui,
          sans-serif;
        text-align: center;
      }

      #app-preloader .bootstrap-error button {
        margin-top: 12px;
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: #c975de;
        color: #0d1117;
        font: inherit;
        cursor: pointer;
      }

      @keyframes app-preloader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <!-- Рантайм-конфиг (генерируется при запуске контейнера) -->
    <script src="./configs/app-config.js"></script>

    <!-- Критические шрифты (Latin + Cyrillic): синхронно, 6 @font-face на вес = 18 woff2, ~200 KB -->
    <link rel="stylesheet" href="./fonts/split/regular/result-critical.css" />
    <link rel="stylesheet" href="./fonts/split/medium/result-critical.css" />
    <link rel="stylesheet" href="./fonts/split/semibold/result-critical.css" />

         реально встречаются иероглифы (см. loadCjkFonts в main.ts) -->

    <script type="module" src="./load-cjk-fonts.ts"></script>

    <script type="speculationrules">
      {
        "prerender": [
          {
            "source": "document",
            "where": {
              "and": [
                { "href_matches": "/*" },
                { "not": { "href_matches": "/sign-in" } },
                { "not": { "href_matches": "/auth/*" } },
                { "not": { "href_matches": "/api/*" } },
                { "not": { "href_matches": "/reader" } },
                { "not": { "href_matches": "/onboarding" } }
              ]
            },
            "eagerness": "moderate",
            "expects_no_vary_search": "params=()"
          }
        ]
      }
    </script>
  </head>

  <body>
    <div id="app-preloader">
      <div class="spinner"></div>
    </div>

    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
