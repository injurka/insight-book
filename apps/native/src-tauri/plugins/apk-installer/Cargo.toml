[package]
name = "tauri-plugin-apk-installer"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-apk-installer"

[dependencies]
tauri = { version = "2.10.3" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
