name: Build & Deploy

on:
  push:
    tags:
      - 'v*.*.*'

env:
  REGISTRY: docker.io
  CLIENT_IMAGE: injurka/insight-book-client
  SERVER_IMAGE: injurka/insight-book-server

jobs:
  # ─── JOB 1: Сборка и пуш клиента ───────────────────────────────
  build-client:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate .env file
        run: |
          echo "VITE_UMAMI_WEBSITE_ID=${{ secrets.VITE_UMAMI_WEBSITE_ID }}" >> .env
          echo "VITE_UMAMI_URL=${{ secrets.VITE_UMAMI_URL }}" >> .env

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CLIENT_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Push Client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.client
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            VITE_UMAMI_WEBSITE_ID=${{ secrets.VITE_UMAMI_WEBSITE_ID }}
            VITE_UMAMI_URL=${{ secrets.VITE_UMAMI_URL }}

  # ─── JOB 2: Сборка и пуш сервера ───────────────────────────────
  build-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SERVER_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Push Server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── JOB 3: Деплой на VDS ───────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: [build-client, build-server]
    steps:
      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT }}
          script: |
            cd /root/sources/insight-book/docker
            
            export V_CLIENT=${{ steps.version.outputs.VERSION }}
            export V_SERVER=${{ steps.version.outputs.VERSION }}

            docker compose pull insight-book-client insight-book-server
            docker compose up -d --no-deps insight-book-client insight-book-server
            docker system prune -a -f --volumes

  # ─── JOB 4: Создание draft-релиза (одна точка) ──────────────────
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.id }}
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'Release ${{ github.ref_name }}'
          body: 'See assets below to download.'
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── JOB 5: Сборка Linux + Windows ──────────────────────
  build-tauri:
    needs: [create-release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: '--target x86_64-unknown-linux-gnu'
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: '--target x86_64-pc-windows-msvc'
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "Syncing version to $VERSION"
          
          node -e "
            const fs = require('fs');
            const paths = [
              'apps/client/src-tauri/tauri.conf.json', 
              'apps/client/package.json',
              'package.json'
            ];
            paths.forEach(p => {
              if(fs.existsSync(p)) {
                const json = JSON.parse(fs.readFileSync(p));
                json.version = '$VERSION';
                fs.writeFileSync(p, JSON.stringify(json, null, 2));
                console.log('Updated ' + p);
              }
            });
          "

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_APP_VERSION: ${{ github.ref_name }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # ─── JOB 6: Сборка Android APK ─────────────────────────
  build-android:
    needs: [create-release]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          node -e "
            const fs = require('fs');
            const paths = [
              'apps/client/src-tauri/tauri.conf.json', 
              'apps/client/package.json',
              'package.json'
            ];
            paths.forEach(p => {
              if(fs.existsSync(p)) {
                const json = JSON.parse(fs.readFileSync(p));
                json.version = '$VERSION';
                fs.writeFileSync(p, JSON.stringify(json, null, 2));
                console.log('Updated ' + p);
              }
            });
          "

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r26d
        run: sdkmanager "ndk;26.3.11579264"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1

      - name: Initialize Android project
        run: bun run --cwd apps/client tauri:android:init
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264

      - name: Setup Android signing
        run: |
          echo "${{ secrets.ANDROID_KEY_BASE64 }}" \
            | base64 --decode > $RUNNER_TEMP/release.keystore
          mkdir -p apps/client/src-tauri/gen/android
          cat > apps/client/src-tauri/gen/android/keystore.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$RUNNER_TEMP/release.keystore
          EOF

      - name: Build Android APK
        run: bun run --cwd apps/client tauri:android:build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          release_id: ${{ needs.create-release.outputs.release_id }}
          files: |
            apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
