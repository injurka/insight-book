services:
  insight-book-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    image: ${REGISTRY:-docker.io}/injurka/insight-book-client:${V_CLIENT:-latest}
    restart: unless-stopped
    environment:
      - VITE_API_URL=${VITE_API_URL:-}
      - VITE_CDN_URL=${VITE_CDN_URL:-}
      - FARO_URL=${FARO_URL:-https://faro.limited-dissolve.ru/collect}
    volumes:
      - ./configs:/usr/share/nginx/html/configs
    networks:
      - trip-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.insight-client.rule=Host(`insight-book.ru`)"
      - "traefik.http.routers.insight-client.entrypoints=websecure"
      - "traefik.http.routers.insight-client.tls.certresolver=letsencrypt"
      - "traefik.http.services.insight-client.loadbalancer.server.port=3334"
      - "traefik.docker.network=trip-net"

  insight-book-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: ${REGISTRY:-docker.io}/injurka/insight-book-server:${V_SERVER:-latest}
    restart: unless-stopped
    environment:
      - PORT=4445
      - DB_PATH=${DB_PATH:-/db/insight-book.sqlite}
      - CATALOG_DB_PATH=${CATALOG_DB_PATH:-/db/catalog.sqlite}
      - DATABASE_URL=${DATABASE_URL:-}
      - DATABASE_AUTH_TOKEN=${DATABASE_AUTH_TOKEN:-}
      - CATALOG_DATABASE_URL=${CATALOG_DATABASE_URL:-}
      - CATALOG_DATABASE_AUTH_TOKEN=${CATALOG_DATABASE_AUTH_TOKEN:-}
      - AI_CONFIG_PATH=${AI_CONFIG_PATH:-/configs/ai-config.json}
      - UPLOADS_PATH=/uploads
      - AUTH_MODE=${AUTH_MODE:-single}
      - JWT_SECRET=${JWT_SECRET:-super-secret-key}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - ENABLE_AUTO_DUMP=${ENABLE_AUTO_DUMP:-true}
      - DUMP_MEDIA=${DUMP_MEDIA:-false}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - UPLOAD_STORAGE=${UPLOAD_STORAGE:-local}
      - DUMP_STORAGE=${DUMP_STORAGE:-local}
      - DUMP_S3_BUCKET=${DUMP_S3_BUCKET:-}
      - DUMP_S3_REGION=${DUMP_S3_REGION:-}
      - DUMP_S3_ENDPOINT=${DUMP_S3_ENDPOINT:-}
      - DUMP_S3_ACCESS_KEY=${DUMP_S3_ACCESS_KEY:-}
      - DUMP_S3_SECRET_KEY=${DUMP_S3_SECRET_KEY:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - YANDEX_CLIENT_ID=${YANDEX_CLIENT_ID:-}
      - YANDEX_CLIENT_SECRET=${YANDEX_CLIENT_SECRET:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - UNISENDER_API_KEY=${UNISENDER_API_KEY:-}
    volumes:
      - ./db:/db
      - ./uploads:/uploads
      - ./configs:/configs
    networks:
      - trip-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.insight-server.rule=Host(`api.insight-book.ru`)"
      - "traefik.http.routers.insight-server.entrypoints=websecure"
      - "traefik.http.routers.insight-server.tls.certresolver=letsencrypt"
      - "traefik.http.services.insight-server.loadbalancer.server.port=4445"
      - "traefik.docker.network=trip-net"

  insight-book-admin:
    build:
      context: ..
      dockerfile: docker/Dockerfile.admin
    image: ${REGISTRY:-docker.io}/injurka/insight-book-admin:${V_ADMIN:-latest}
    restart: unless-stopped
    environment:
      - VITE_API_URL=${VITE_API_URL:-}
    networks:
      - trip-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.insight-admin.rule=Host(`admin.insight-book.ru`)"
      - "traefik.http.routers.insight-admin.entrypoints=websecure"
      - "traefik.http.routers.insight-admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.insight-admin.loadbalancer.server.port=3335"
      - "traefik.docker.network=trip-net"

networks:
  trip-net:
    external: true
    name: trip-net

