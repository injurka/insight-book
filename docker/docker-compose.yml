services:
  insight-book-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
      args:
        - VITE_UMAMI_WEBSITE_ID=${VITE_UMAMI_WEBSITE_ID}
        - VITE_UMAMI_URL=${VITE_UMAMI_URL}
    image: ${REGISTRY:-docker.io}/injurka/insight-book-client:${V_CLIENT:-latest}
    restart: unless-stopped
    volumes:
      - ./configs:/usr/share/nginx/html/configs
    networks:
      - trip-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.insight-client.rule=Host(`insight-book.trip-scheduler.ru`)"
      - "traefik.http.routers.insight-client.entrypoints=websecure"
      - "traefik.http.routers.insight-client.tls.certresolver=letsencrypt"
      - "traefik.http.services.insight-client.loadbalancer.server.port=3334"
      - "traefik.docker.network=trip-net"

  insight-book-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: ${REGISTRY:-docker.io}/injurka/insight-book-server:${V_SERVER:-latest}
    restart: unless-stopped
    environment:
      - PORT=4445
      - DB_PATH=/db/insight-book.sqlite
      - DICTS_PATH=/db/dicts
      - UPLOADS_PATH=/uploads
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_URL=${LLM_API_URL:-https://aihubmix.com/v1}
      # Динамические переменные авторизации
      - AUTH_MODE=${AUTH_MODE:-single}
      - JWT_SECRET=${JWT_SECRET:-super-secret-key-change-me}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      # Настройки бэкапов (S3 Dump)
      - ENABLE_AUTO_DUMP=${ENABLE_AUTO_DUMP:-true}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    volumes:
      - ./db:/db
      - ./uploads:/uploads
    networks:
      - trip-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.insight-server.rule=Host(`insight-api.trip-scheduler.ru`)"
      - "traefik.http.routers.insight-server.entrypoints=websecure"
      - "traefik.http.routers.insight-server.tls.certresolver=letsencrypt"
      - "traefik.http.services.insight-server.loadbalancer.server.port=4445"
      - "traefik.docker.network=trip-net"

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD:-umami_secure_password}@umami-db:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${UMAMI_APP_SECRET:-generate_a_random_secret_string}
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - trip-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.insight-analytics.rule=Host(`insight-analytics.trip-scheduler.ru`)"
      - "traefik.http.routers.insight-analytics.entrypoints=websecure"
      - "traefik.http.routers.insight-analytics.tls.certresolver=letsencrypt"
      - "traefik.http.services.insight-analytics.loadbalancer.server.port=3000"
      - "traefik.docker.network=trip-net"

  umami-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD:-umami_secure_password}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - trip-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  trip-net:
    external: true
    name: trip-net

volumes:
  umami-db-data:
