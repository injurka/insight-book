services:
  insight-book-client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
      args:
        - VITE_UMAMI_WEBSITE_ID=${VITE_UMAMI_WEBSITE_ID:-}
        - VITE_UMAMI_URL=${VITE_UMAMI_URL:-}
    image: ${REGISTRY:-docker.io}/injurka/insight-book-client:${V_CLIENT:-latest}
    restart: unless-stopped
    volumes:
      - ./configs:/usr/share/nginx/html/configs
    networks:
      - trip-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.insight-client.rule=Host(`insight-book.ru`)"
      - "traefik.http.routers.insight-client.entrypoints=websecure"
      - "traefik.http.routers.insight-client.tls.certresolver=letsencrypt"
      - "traefik.http.services.insight-client.loadbalancer.server.port=3334"
      - "traefik.docker.network=trip-net"

  insight-book-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: ${REGISTRY:-docker.io}/injurka/insight-book-server:${V_SERVER:-latest}
    restart: unless-stopped
    environment:
      - PORT=4445
      - DB_PATH=/db/insight-book.sqlite
      - CATALOG_DB_PATH=/db/catalog.sqlite
      - DICTS_PATH=/db/dicts
      - UPLOADS_PATH=/uploads
      - AI_CONFIG_PATH=${AI_CONFIG_PATH:-/configs/ai-config.json}
      - AUTH_MODE=${AUTH_MODE:-single}
      - JWT_SECRET=${JWT_SECRET:-super-secret-key}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - ENABLE_AUTO_DUMP=${ENABLE_AUTO_DUMP:-true}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - YANDEX_CLIENT_ID=${YANDEX_CLIENT_ID:-}
      - YANDEX_CLIENT_SECRET=${YANDEX_CLIENT_SECRET:-}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/configs/firebase-service-account.json
    volumes:
      - ./db:/db
      - ./uploads:/uploads
      - ./configs:/configs
    networks:
      - trip-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.insight-server.rule=Host(`api.insight-book.ru`)"
      - "traefik.http.routers.insight-server.entrypoints=websecure"
      - "traefik.http.routers.insight-server.tls.certresolver=letsencrypt"
      - "traefik.http.services.insight-server.loadbalancer.server.port=4445"
      - "traefik.docker.network=trip-net"

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://umami:${UMAMI_DB_PASSWORD:-umami_secure_password}@umami-db:5432/umami
      - DATABASE_TYPE=postgresql
      - APP_SECRET=${UMAMI_APP_SECRET:-generate_a_random_secret_string}
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - trip-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.insight-analytics.rule=Host(`analytics.insight-book.ru`)"
      - "traefik.http.routers.insight-analytics.entrypoints=websecure"
      - "traefik.http.routers.insight-analytics.tls.certresolver=letsencrypt"
      - "traefik.http.services.insight-analytics.loadbalancer.server.port=3000"
      - "traefik.docker.network=trip-net"

      - "traefik.http.routers.umami-script.rule=Host(`insight-book.ru`) && Path(`/stats/app.js`)"
      - "traefik.http.routers.umami-script.entrypoints=websecure"
      - "traefik.http.routers.umami-script.tls.certresolver=letsencrypt"
      - "traefik.http.routers.umami-script.service=insight-analytics"
      - "traefik.http.routers.umami-script.middlewares=umami-script-rw"
      - "traefik.http.middlewares.umami-script-rw.replacepath.path=/script.js"

      - "traefik.http.routers.umami-api.rule=Host(`insight-book.ru`) && PathPrefix(`/api/send`)"
      - "traefik.http.routers.umami-api.entrypoints=websecure"
      - "traefik.http.routers.umami-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.umami-api.service=insight-analytics"

  umami-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=umami
      - POSTGRES_USER=umami
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD:-umami_secure_password}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - trip-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  trip-net:
    external: true
    name: trip-net

volumes:
  umami-db-data:
